<html>
    <head>
        <title>Weather-App</title>
         <link rel="stylesheet" href="Weather-App.css">
        <body>
            <div class="card">
                <div class="search">
                <input type="text" placeholder="enter your city name" spellcheck="false" autofocus>
                <button><img src="images/search.PNG" width="20px" height="20px"></button>
                </div>
                <div class="error">
                <p>Invalid city name</p>
                </div>
                <div class="weather">
                <img src="images/default.PNG" width="100px" height="100px" class="weather-icon">
                <h1 class="temp">22°c</h1>
                <h1 class="city"><font color="black" face="vivaldi">New York</font></h1></div>
                <div class="details">
                    <div class="col">
                        <img src="images\humidity.PNG">
                            <h3 class="humidity">50% Humidity</h3>
                    </div>
                    <div class="col">
                       <img src="images\wind.PNG">
                            <h3 class="wind">15 km/hr Wind Speed</h3>
                    </div>
                </div>
            </div>
            <script src="Weather-App.js"></script>
        </body>
    </head>
</html>
